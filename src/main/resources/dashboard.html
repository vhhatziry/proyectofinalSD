<!DOCTYPE html>
<!--
  Tesoreria Distribuida (Equipo 18) - single-page cluster dashboard.
  Pure HTML/CSS/vanilla-JS, zero dependencies, system fonts only. Consumes
  GET /panel (this node + peers) and renders one engraved card per node with
  the contract fields: status, account count, total balance, transfer count,
  last transaction id, CPU%, RAM%, Disk% and the Cloud Storage transaction
  count. "Refrescar" reloads on demand; the reactive toggle polls live.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesoreria Distribuida - Camara de compensacion</title>
  <style>
    :root {
      --ink:        #06211c;
      --ink-700:    #0a2a23;
      --ink-600:    #0e3329;
      --ink-500:    #143f33;
      --line:       rgba(201, 162, 75, .20);
      --line-soft:  rgba(236, 227, 207, .08);
      --brass:      #c9a24b;
      --brass-lit:  #eccd80;
      --patina:     #5fbfa9;
      --paper:      #ece3cf;
      --paper-dim:  #92a89e;
      --alarm:      #db6a42;
      --ok:         #5fbfa9;

      --display: Georgia, "Times New Roman", "Hoefler Text", serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
      --ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--ui);
      color: var(--paper);
      background-color: var(--ink);
      /* Guilloche atmosphere: fine engraved rings + spokes, then a vignette. */
      background-image:
        radial-gradient(ellipse at 50% -10%, rgba(95, 191, 169, .10), transparent 60%),
        radial-gradient(ellipse at 100% 110%, rgba(201, 162, 75, .08), transparent 55%),
        repeating-radial-gradient(circle at 82% 18%, transparent 0 13px, var(--line-soft) 13px 14px),
        repeating-radial-gradient(circle at 12% 88%, transparent 0 17px, var(--line-soft) 17px 18px);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 1180px; margin: 0 auto; padding: clamp(1.1rem, 3vw, 2.4rem); }

    /* ---- Masthead ---------------------------------------------------- */
    .mast {
      display: flex; flex-wrap: wrap; align-items: flex-end;
      gap: 1rem 1.5rem; justify-content: space-between;
      padding-bottom: 1.1rem; border-bottom: 1px solid var(--line);
    }
    .brand__eyebrow {
      font-size: .68rem; letter-spacing: .42em; text-transform: uppercase;
      color: var(--brass); margin: 0 0 .5rem;
    }
    .brand__title {
      font-family: var(--display); font-weight: 400; font-style: italic;
      font-size: clamp(1.8rem, 5vw, 3rem); line-height: .98; margin: 0;
      letter-spacing: .005em;
    }
    .brand__title b { font-style: normal; font-weight: 700; color: var(--brass-lit); }

    .controls { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }

    .pill {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
      padding: .42rem .7rem; border-radius: 999px;
      border: 1px solid var(--line); color: var(--paper-dim);
      background: rgba(6, 33, 28, .6);
    }
    .pill__dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--paper-dim); }
    .pill[data-live="on"]  { color: var(--ok); border-color: rgba(95,191,169,.5); }
    .pill[data-live="on"]  .pill__dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(95,191,169,.6); animation: ping 1.6s ease-out infinite; }
    .pill[data-live="off"] { color: var(--alarm); border-color: rgba(219,106,66,.5); }
    .pill[data-live="off"] .pill__dot { background: var(--alarm); }

    .btn {
      font-family: var(--ui); font-size: .82rem; letter-spacing: .04em;
      color: var(--ink); background: linear-gradient(180deg, var(--brass-lit), var(--brass));
      border: 1px solid var(--brass); border-radius: 8px;
      padding: .55rem .95rem; cursor: pointer; font-weight: 600;
      box-shadow: 0 1px 0 rgba(236,227,207,.25) inset, 0 6px 16px rgba(0,0,0,.3);
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }
    .btn[data-busy="1"] { filter: saturate(.6) brightness(.9); cursor: progress; }

    /* Brass lever switch for the reactive toggle. */
    .switch { display: inline-flex; align-items: center; gap: .55rem; cursor: pointer; user-select: none; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch__track {
      width: 46px; height: 24px; border-radius: 999px; position: relative;
      background: var(--ink-700); border: 1px solid var(--line); transition: background .2s ease;
    }
    .switch__track::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(180deg, #d9d2c0, #9b937e);
      box-shadow: 0 1px 3px rgba(0,0,0,.5); transition: transform .2s ease;
    }
    .switch input:checked + .switch__track { background: rgba(95,191,169,.32); border-color: rgba(95,191,169,.6); }
    .switch input:checked + .switch__track::after { transform: translateX(22px); background: linear-gradient(180deg, var(--brass-lit), var(--brass)); }
    .switch input:focus-visible + .switch__track { outline: 2px solid var(--brass-lit); outline-offset: 2px; }
    .switch__label { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--paper-dim); }

    /* ---- Hero / clearing seal --------------------------------------- */
    .hero {
      display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: center;
      padding: clamp(1.3rem, 4vw, 2.6rem) 0 1.7rem;
    }
    .hero__label { font-size: .72rem; letter-spacing: .34em; text-transform: uppercase; color: var(--paper-dim); margin: 0 0 .55rem; }
    .hero__amount {
      font-family: var(--display); font-variant-numeric: tabular-nums lining-nums;
      font-size: clamp(2.3rem, 8vw, 4.6rem); line-height: .96; margin: 0;
      color: var(--paper); text-shadow: 0 1px 0 rgba(0,0,0,.4);
    }
    .hero__amount .cent { color: var(--brass); font-size: .52em; vertical-align: baseline; }
    .hero__meta { margin: .8rem 0 0; color: var(--paper-dim); font-size: .92rem; }
    .hero__meta b { color: var(--paper); font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .hero__meta .seq { color: var(--brass-lit); font-family: var(--mono); }

    .seal { position: relative; width: 156px; height: 156px; display: grid; place-items: center; flex: none; }
    .seal__ring {
      position: absolute; inset: 0; border-radius: 50%;
      background:
        repeating-conic-gradient(from 0deg, rgba(201,162,75,.16) 0deg 2.2deg, transparent 2.2deg 5.4deg),
        repeating-radial-gradient(circle, transparent 0 5px, rgba(201,162,75,.14) 5px 6px);
      border: 1px solid var(--line);
      box-shadow: 0 0 0 6px rgba(6,33,28,.6), inset 0 0 24px rgba(0,0,0,.4);
      animation: spin 36s linear infinite;
    }
    .seal__face {
      position: relative; width: 108px; height: 108px; border-radius: 50%;
      display: grid; place-content: center; text-align: center; gap: .12rem;
      background: radial-gradient(circle at 50% 35%, var(--ink-500), var(--ink-700));
      border: 1px solid var(--line);
    }
    .seal__mark { font-size: 1.5rem; line-height: 1; color: var(--brass-lit); }
    .seal__title { font-size: .58rem; letter-spacing: .24em; color: var(--paper-dim); }
    .seal__sub { font-family: var(--display); font-style: italic; font-size: .96rem; color: var(--brass-lit); }
    .seal[data-ok="false"] .seal__ring {
      background:
        repeating-conic-gradient(from 0deg, rgba(219,106,66,.18) 0deg 2.2deg, transparent 2.2deg 5.4deg),
        repeating-radial-gradient(circle, transparent 0 5px, rgba(219,106,66,.16) 5px 6px);
    }
    .seal[data-ok="false"] .seal__mark,
    .seal[data-ok="false"] .seal__sub { color: var(--alarm); }
    .seal.stamp .seal__face { animation: stamp .5s cubic-bezier(.2,1.4,.4,1); }

    /* ---- Nodes ------------------------------------------------------- */
    .section-label {
      display: flex; align-items: center; gap: 1rem; margin: .5rem 0 1rem;
      font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; color: var(--brass);
    }
    .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.1rem; }

    .node {
      position: relative; border: 1px solid var(--line); border-radius: 14px;
      padding: 1.15rem 1.2rem 1.3rem;
      background:
        linear-gradient(180deg, rgba(20,63,51,.5), rgba(10,42,35,.5));
      overflow: hidden;
    }
    .node::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--patina); opacity: .8; }
    .node--leader::before { background: linear-gradient(90deg, var(--brass), var(--brass-lit)); height: 4px; }
    .node[data-status="down"] { opacity: .62; filter: grayscale(.35); }
    .node[data-status="down"]::before { background: var(--alarm); }

    .node__head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: 1rem; }
    .node__id { display: flex; align-items: center; gap: .55rem; }
    .node__id h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.32rem; letter-spacing: .01em; }
    .dot { width: .62rem; height: .62rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(95,191,169,.55); animation: ping 2s ease-out infinite; }
    .node[data-status="down"] .dot { background: var(--alarm); animation: none; box-shadow: none; }
    .badge {
      font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700;
      padding: .22rem .5rem; border-radius: 6px; border: 1px solid var(--line); color: var(--patina);
    }
    .badge--leader { color: var(--ink); background: linear-gradient(180deg, var(--brass-lit), var(--brass)); border-color: var(--brass); }
    .node__state { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim); }
    .node[data-status="up"] .node__state { color: var(--ok); }
    .node[data-status="down"] .node__state { color: var(--alarm); }

    .node__balance { padding: .1rem 0 1rem; border-bottom: 1px solid var(--line-soft); margin-bottom: .9rem; }
    .node__balance dt { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--paper-dim); margin-bottom: .25rem; }
    .node__balance dd {
      margin: 0; font-family: var(--display); font-variant-numeric: tabular-nums lining-nums;
      font-size: 1.7rem; color: var(--paper);
    }

    .metrics { display: grid; gap: .15rem; margin: 0 0 1rem; }
    .metric { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: .28rem 0; }
    .metric dt { color: var(--paper-dim); font-size: .82rem; }
    .metric dd {
      margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums;
      font-size: .96rem; color: var(--paper); border-radius: 5px; padding: 0 .2rem;
    }
    .metric dd.seq { color: var(--brass-lit); }
    .metric--gcs dd { color: var(--patina); }
    /* Ticker flash when a value changes between refreshes. */
    dd.tick { animation: tick 1.1s ease-out; }

    .gauges { display: grid; gap: .6rem; }
    .gauge__top { display: flex; justify-content: space-between; font-size: .72rem; letter-spacing: .08em; margin-bottom: .25rem; }
    .gauge__top span:first-child { color: var(--paper-dim); text-transform: uppercase; }
    .gauge__top span:last-child { font-family: var(--mono); color: var(--paper); }
    .gauge__track { height: 6px; border-radius: 999px; background: rgba(6,33,28,.8); border: 1px solid var(--line-soft); overflow: hidden; }
    .gauge__fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--patina), var(--brass)); transition: width .6s cubic-bezier(.3,.8,.3,1); }
    .gauge__fill[data-hot="1"] { background: linear-gradient(90deg, var(--brass), var(--alarm)); }

    /* ---- States & footer -------------------------------------------- */
    .banner {
      display: none; align-items: center; gap: .6rem; margin: 1rem 0 0;
      padding: .7rem 1rem; border-radius: 10px;
      border: 1px solid rgba(219,106,66,.5); background: rgba(219,106,66,.1); color: var(--alarm);
      font-size: .88rem;
    }
    .banner[data-show="1"] { display: flex; }
    .foot { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--paper-dim); font-size: .74rem; letter-spacing: .06em; display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
    .foot b { color: var(--paper); font-family: var(--mono); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(95,191,169,.5); } 70%,100% { box-shadow: 0 0 0 7px rgba(95,191,169,0); } }
    @keyframes stamp { 0% { transform: scale(1.5); opacity: 0; } 60% { transform: scale(.94); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes tick { 0% { background: rgba(201,162,75,.45); color: var(--ink); } 100% { background: transparent; } }

    @media (max-width: 620px) {
      .hero { grid-template-columns: 1fr; }
      .seal { justify-self: start; }
    }
    @media (prefers-reduced-motion: reduce) {
      .seal__ring, .dot, .pill__dot { animation: none !important; }
      .seal.stamp .seal__face, dd.tick { animation: none !important; }
      .gauge__fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div class="brand">
        <p class="brand__eyebrow">Camara de compensacion &middot; Equipo 18</p>
        <h1 class="brand__title">Tesoreria <b>Distribuida</b></h1>
      </div>
      <div class="controls">
        <span class="pill" id="livePill" data-live="off"><span class="pill__dot"></span><span id="liveText">Sin conexion</span></span>
        <button class="btn" id="refresh" type="button">Refrescar</button>
        <label class="switch">
          <input type="checkbox" id="reactive">
          <span class="switch__track"></span>
          <span class="switch__label">En vivo</span>
        </label>
      </div>
    </header>

    <section class="hero">
      <div>
        <p class="hero__label">Saldo total del cluster</p>
        <h2 class="hero__amount" id="heroAmount">&mdash;</h2>
        <p class="hero__meta" id="heroMeta">Esperando al cluster&hellip;</p>
      </div>
      <div class="seal" id="seal" data-ok="true">
        <div class="seal__ring"></div>
        <div class="seal__face">
          <span class="seal__mark" id="sealMark">&check;</span>
          <span class="seal__title">Invariante</span>
          <span class="seal__sub" id="sealSub">Conservado</span>
        </div>
      </div>
    </section>

    <div class="banner" id="banner" data-show="0"><span>&#9888;</span><span id="bannerText"></span></div>

    <p class="section-label">Nodos del cluster</p>
    <section class="nodes" id="nodes"></section>

    <footer class="foot">
      <span>Tesoreria Distribuida &mdash; mini banco concurrente distribuido</span>
      <span id="footMeta">&mdash;</span>
    </footer>
  </div>

  <script>
    "use strict";

    // Poll cadence (ms) used when the reactive toggle is enabled.
    const REACTIVE_INTERVAL_MS = 1500;
    let timer = null;
    let lastValues = {};   // "nodeId|field" -> previous text, to flash on change

    const pesos = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: 2 });
    const count = new Intl.NumberFormat("es-MX");

    const $ = (id) => document.getElementById(id);

    // Fetch the aggregated panel payload and repaint, surfacing errors inline.
    async function loadPanel() {
      const btn = $("refresh");
      btn.dataset.busy = "1";
      try {
        const res = await fetch("/panel", { headers: { "Accept": "application/json" }, cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        render(data.nodes || []);
        setLive(true);
        $("banner").dataset.show = "0";
      } catch (err) {
        setLive(false);
        const b = $("banner");
        b.dataset.show = "1";
        $("bannerText").textContent = "No se pudo leer /panel: " + err.message + ". Reintentando segun el modo en vivo.";
      } finally {
        btn.dataset.busy = "0";
      }
    }

    // Repaint hero, consistency seal and the per-node cards.
    function render(nodes) {
      const up = nodes.filter(n => n.status === "up");
      const leader = up.find(n => n.role === "leader") || up[0] || null;

      // Hero: the conserved cluster total is the leader's total balance.
      if (leader) {
        $("heroAmount").innerHTML = splitCents(pesos.format(num(leader.totalBalance)));
        $("heroMeta").innerHTML =
          "<b>" + count.format(num(leader.accountCount)) + "</b> cuentas &middot; " +
          up.length + " de " + nodes.length + " nodos en linea &middot; ultima tx <span class=\"seq\">#" +
          count.format(num(leader.lastTxId)) + "</span>";
      } else {
        $("heroAmount").innerHTML = "&mdash;";
        $("heroMeta").textContent = "Ningun nodo en linea.";
      }

      // Consistency seal: do all live nodes agree on the total (to the cent)?
      const totals = new Set(up.map(n => Math.round(num(n.totalBalance) * 100)));
      const conserved = totals.size <= 1;
      setSeal(conserved, up.length, nodes.length);

      // Cards.
      const host = $("nodes");
      host.innerHTML = "";
      nodes.forEach(n => host.appendChild(card(n)));

      const now = new Date().toLocaleTimeString("es-MX");
      $("footMeta").innerHTML = "Actualizado <b>" + now + "</b>" +
        ($("reactive").checked ? " &middot; en vivo cada " + (REACTIVE_INTERVAL_MS / 1000) + "s" : "");
    }

    function card(n) {
      const down = n.status !== "up";
      const isLeader = n.role === "leader";
      const el = document.createElement("article");
      el.className = "node" + (isLeader ? " node--leader" : "");
      el.dataset.status = down ? "down" : "up";

      el.appendChild(html(
        '<div class="node__head">' +
          '<div class="node__id">' +
            '<span class="dot"></span>' +
            '<h3>' + esc(n.nodeId) + '</h3>' +
            '<span class="badge ' + (isLeader ? "badge--leader" : "") + '">' + (isLeader ? "Lider" : "Replica") + '</span>' +
          '</div>' +
          '<span class="node__state">' + (down ? "Caido" : "Activo") + '</span>' +
        '</div>'
      ));
      el.appendChild(html(
        '<dl class="node__balance"><dt>Saldo del nodo</dt><dd>' +
        (down ? "&mdash;" : pesos.format(num(n.totalBalance))) + '</dd></dl>'
      ));

      const metrics = html('<dl class="metrics"></dl>');
      metrics.appendChild(metric(n.nodeId, "Cuentas", "accountCount", count.format(num(n.accountCount))));
      metrics.appendChild(metric(n.nodeId, "Transferencias", "transferCount", count.format(num(n.transferCount))));
      metrics.appendChild(metric(n.nodeId, "Ultima tx", "lastTxId", "#" + count.format(num(n.lastTxId)), "seq"));
      metrics.appendChild(metric(n.nodeId, "Tx en Cloud Storage", "gcsCount", count.format(num(n.gcsCount)), "", "metric--gcs"));
      el.appendChild(metrics);

      const gauges = html('<div class="gauges"></div>');
      gauges.appendChild(gauge("CPU", num(n.cpuPercent)));
      gauges.appendChild(gauge("RAM", num(n.ramPercent)));
      gauges.appendChild(gauge("Disco", num(n.diskPercent)));
      el.appendChild(gauges);
      return el;
    }

    function metric(nodeId, label, field, value, extra, rowClass) {
      const row = html('<div class="metric ' + (rowClass || "") + '"><dt>' + label + '</dt></div>');
      const dd = document.createElement("dd");
      if (extra) dd.className = extra;
      dd.innerHTML = value;
      flash(nodeId, field, value, dd);
      row.appendChild(dd);
      return row;
    }

    function gauge(label, pct) {
      const hot = pct >= 80 ? "1" : "0";
      return html(
        '<div class="gauge">' +
          '<div class="gauge__top"><span>' + label + '</span><span>' + pct.toFixed(1) + '%</span></div>' +
          '<div class="gauge__track"><div class="gauge__fill" data-hot="' + hot + '" style="width:' + Math.min(100, pct) + '%"></div></div>' +
        '</div>'
      );
    }

    // Flash a value cell in brass when it changed since the last refresh.
    function flash(nodeId, field, value, el) {
      const key = nodeId + "|" + field;
      if (lastValues[key] !== undefined && lastValues[key] !== value) el.classList.add("tick");
      lastValues[key] = value;
    }

    function setSeal(ok, upCount, total) {
      const seal = $("seal");
      const was = seal.dataset.ok;
      seal.dataset.ok = ok ? "true" : "false";
      $("sealMark").innerHTML = ok ? "&check;" : "&ne;";
      $("sealSub").textContent = ok ? "Conservado" : "Discrepancia";
      if (was !== seal.dataset.ok) { seal.classList.remove("stamp"); void seal.offsetWidth; seal.classList.add("stamp"); }
    }

    function setLive(online) {
      const pill = $("livePill");
      if (online && $("reactive").checked) { pill.dataset.live = "on"; $("liveText").textContent = "En vivo"; }
      else if (online) { pill.dataset.live = "on"; $("liveText").textContent = "En linea"; }
      else { pill.dataset.live = "off"; $("liveText").textContent = "Sin conexion"; }
    }

    // Split the trailing cents so they can be tinted in brass.
    function splitCents(s) {
      const i = s.lastIndexOf(".");
      return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<span class="cent">' + esc(s.slice(i)) + '</span>';
    }

    function toggleReactive(enabled) {
      if (timer) { clearInterval(timer); timer = null; }
      if (enabled) timer = setInterval(loadPanel, REACTIVE_INTERVAL_MS);
      loadPanel();
    }

    const num = (v) => (typeof v === "number" ? v : parseFloat(v) || 0);
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function html(markup) { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; }

    $("refresh").addEventListener("click", loadPanel);
    $("reactive").addEventListener("change", (e) => toggleReactive(e.target.checked));
    loadPanel();
  </script>
</body>
</html>
