<!DOCTYPE html>
<!--

  transfer count, last transaction id, CPU%, RAM%, Disk% and the number of

-->

    header { display: flex; gap: 1rem; align-items: center; }
    .nodes { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-width: 16rem; }
    .card h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    .row { display: flex; justify-content: space-between; padding: .15rem 0; }
    .label { color: #555; }
    .up { color: green; }
    .down { color: red; }
  </style>
